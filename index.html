<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1b1712" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Sparky Discovery — One Roll of Film</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <canvas id="game"></canvas>

  <!-- Loading -->
  <div id="loading" class="screen">
    <div class="loading-inner">
      <div class="brownie-icon" aria-hidden="true"></div>
      <p class="loading-label">Developing film…</p>
      <div class="bar"><div id="loading-bar"></div></div>
    </div>
  </div>

  <!-- Title -->
  <div id="title" class="screen hidden">
    <div class="title-inner">
      <p class="eyebrow">Sparky Discovery</p>
      <h1>One Roll of Film</h1>
      <p class="tagline">Three photographs. Three days that shaped Singapore.</p>
      <div class="menu">
        <button id="btn-begin" class="btn primary">Begin</button>
        <button id="btn-chapters" class="btn">Chapters</button>
        <button id="btn-settings-title" class="btn">Settings</button>
      </div>
      <div id="chapter-list" class="chapter-list hidden">
        <button class="chapter-card" data-chapter="ww2"><span class="yr">1942</span><span>The Fortress Falls</span></button>
        <button class="chapter-card locked" disabled><span class="yr">1965</span><span>A Nation Is Born</span><em>Coming soon</em></button>
        <button class="chapter-card locked" disabled><span class="yr">1967</span><span>The First Intake</span><em>Coming soon</em></button>
      </div>
      <p class="hint" id="title-hint"></p>
    </div>
  </div>

  <!-- HUD -->
  <div id="hud" class="hidden">
    <div id="objective" class="objective hidden"><span class="obj-label">Objective</span><span id="objective-text"></span></div>
    <div class="top-right">
      <button id="btn-cam-hud" class="icon-btn" aria-label="Raise camera" title="Raise camera (C)">
        <svg viewBox="0 0 24 24"><path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V8a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="13" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
        <kbd class="key-badge">C</kbd>
      </button>
      <button id="btn-album" class="icon-btn" aria-label="Photo album" title="Photo album (J)">
        <svg viewBox="0 0 24 24"><path d="M5 4.5h10.5A2.5 2.5 0 0 1 18 7v12.5H7.5A2.5 2.5 0 0 1 5 17V4.5z" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M5 17a2.5 2.5 0 0 1 2.5-2.5H18" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9 8h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <kbd class="key-badge">J</kbd>
      </button>
      <button id="btn-pause" class="icon-btn" aria-label="Pause" title="Pause (Esc)">
        <svg viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" rx="1" fill="currentColor"/><rect x="14" y="5" width="4" height="14" rx="1" fill="currentColor"/></svg>
        <kbd class="key-badge">Esc</kbd>
      </button>
    </div>
    <div id="compass" class="compass hidden">
      <svg class="compass-arrow" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M32 4 L54 30 L40 30 L40 58 L24 58 L24 30 L10 30 Z" fill="currentColor" stroke="#1b1712" stroke-width="3" stroke-linejoin="round"/>
      </svg>
      <div class="compass-dist" id="compass-dist"></div>
    </div>
    <div id="prompt" class="prompt hidden"><kbd>E</kbd><span id="prompt-text"></span></div>
    <div id="counter" class="counter hidden"></div>
    <div id="caption" class="caption hidden"></div>
    <div id="toast" class="toast hidden"><div class="toast-title"></div><div class="toast-body"></div></div>

    <!-- Touch controls -->
    <div id="touch" class="touch hidden">
      <div id="stick-zone" class="stick-zone"></div>
      <div id="stick" class="stick hidden"><div class="stick-knob"></div></div>
      <button id="btn-action" class="action-btn" aria-label="Interact"><span id="action-label">Interact</span></button>
      <button id="btn-run" class="run-btn" aria-label="Run">Run</button>

    </div>
  </div>

  <!-- Dialogue -->
  <div id="dialogue" class="dialogue hidden" role="dialog" aria-live="polite">
    <div class="dlg-name" id="dlg-name"></div>
    <div class="dlg-text" id="dlg-text"></div>
    <div class="dlg-next" id="dlg-next">▼</div>
  </div>

  <!-- Choices -->
  <div id="choices" class="choices hidden"></div>
  <div id="pick" class="pick hidden"><h3 id="pick-title"></h3><p id="pick-sub"></p><div class="pick-grid" id="pick-grid"></div></div>

  <!-- Viewfinder -->
  <div id="viewfinder" class="viewfinder hidden">
    <div class="vf-frame"><img id="vf-ghost" class="vf-ghost hidden" alt="" /><i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i><div class="vf-cross"></div></div>
    <div class="vf-note hidden" id="vf-note"></div>
    <div class="vf-label" id="vf-label"></div>
    <div class="vf-controls">
      <button id="btn-vf-cancel" class="btn small">Back</button>
      <button id="btn-shutter" class="shutter" aria-label="Take photo"></button>
      <span class="vf-hint" id="vf-hint">Drag / mouse / <kbd>WASD</kbd> to aim · <kbd>Space</kbd> or <kbd>Click</kbd> to snap</span>
    </div>
  </div>
  <div id="flash" class="flash"></div>
  <div id="iris" class="iris"></div>

  <!-- Developing photo -->
  <div id="develop" class="develop hidden">
    <div class="polaroid"><img id="develop-img" alt="" /><div class="pol-caption" id="develop-caption"></div></div>
    <div class="fact-card"><div class="fact-year" id="develop-year"></div><h3 id="develop-title"></h3><p id="develop-text"></p><button id="btn-develop-ok" class="btn primary small">Add to album</button></div>
  </div>

  <!-- Album -->
  <div id="album" class="overlay hidden">
    <div class="album-book">
      <header><h2>Sparky's Album</h2><button id="btn-album-close" class="btn small">Close</button></header>
      <nav class="album-tabs">
        <button data-tab="photos" class="active">Photos</button>
        <button data-tab="facts">Real vs imagined</button>
        <button data-tab="sources">Sources &amp; credits</button>
      </nav>
      <div class="album-page" id="album-photos"></div>
      <div class="album-page hidden" id="album-facts"></div>
      <div class="album-page hidden" id="album-sources"></div>
    </div>
  </div>

  <!-- Pause / settings -->
  <div id="pause" class="overlay hidden">
    <div class="panel">
      <h2 id="pause-title">Paused</h2>
      <div class="settings">
        <label>Graphics <select id="set-quality"><option value="low">Low (phones)</option><option value="medium">Medium</option><option value="high">High (desktop)</option></select></label>
        <label>Master volume <input id="set-volume" type="range" min="0" max="1" step="0.05" /></label>
        <label>Music <input id="set-music" type="range" min="0" max="1" step="0.05" /></label>
        <label class="check"><input id="set-subtitles" type="checkbox" /> Sound captions</label>
        <label class="check"><input id="set-motion" type="checkbox" /> Reduce camera shake &amp; flashes</label>
        <label class="check"><input id="set-invert" type="checkbox" /> Invert camera Y</label>
      </div>
      <div class="controls-help" id="controls-help"></div>
      <div class="menu">
        <button id="btn-resume" class="btn primary">Resume</button>
        <button id="btn-restart" class="btn">Restart chapter</button>
        <button id="btn-quit" class="btn">Title screen</button>
      </div>
    </div>
  </div>

  <!-- Fades & cards -->
  <div id="fade" class="fade"></div>
  <div id="card" class="card hidden"><div class="card-kicker" id="card-kicker"></div><div class="card-title" id="card-title"></div><div class="card-sub" id="card-sub"></div></div>
  <div id="rotate" class="rotate-hint"><div>Turn your phone sideways for the best view ↻</div></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
