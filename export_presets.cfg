[preset.0]

name="Web"
platform="Web"
runnable=true
export_filter="all_resources"
include_filter="assets/video/*.json,assets/video/*.md,assets/voice/*.md,assets/audio/*.md"
exclude_filter="artifacts/*,build/*,tests/*,tools/*,docs/*,assets/sparky/v1/*,assets/sparky/before-refinement/*,assets/sparky/walk-frames/*,assets/sparky/walk-loop/*,assets/sparky/sparky-preview.png,assets/sparky/sparky-front.png,assets/sparky/sparky-back.png,assets/sparky/sparky-side.png,assets/sparky/sparky-walk-side.png,assets/sparky/sparky-export-*.png,assets/sparky/*.gif,assets/sparky/*.json,scenes/character_studio*"
export_path="build/web/index.html"

[preset.0.options]

variant/extensions_support=false
variant/thread_support=false
vram_texture_compression/for_desktop=true
vram_texture_compression/for_mobile=true
html/canvas_resize_policy=2
html/focus_canvas_on_start=true
progressive_web_app/enabled=false

