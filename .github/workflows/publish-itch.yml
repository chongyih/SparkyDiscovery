name: Publish to itch.io

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish a running upload before starting the next release.
concurrency:
  group: itch-release
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.7.2

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          release="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          editor="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          templates="Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$RUNNER_TEMP/godot"
          cd "$RUNNER_TEMP/godot"
          curl --fail --location --retry 3 "$release/$editor" -o "$editor"
          curl --fail --location --retry 3 "$release/$templates" -o "$templates"
          curl --fail --location --retry 3 "$release/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          grep -F -e " $editor" -e " $templates" SHA512-SUMS.txt > selected-sums.txt
          test "$(wc -l < selected-sums.txt)" -eq 2
          sha512sum --check selected-sums.txt
          unzip -q "$editor"
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot
          chmod +x godot
          echo "$RUNNER_TEMP/godot" >> "$GITHUB_PATH"
          template_dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$template_dir"
          unzip -q -j "$templates" 'templates/web*' 'templates/windows*' 'templates/linux*' 'templates/macos.zip' 'templates/version.txt' 'templates/icudt_godot.dat' -d "$template_dir"

      - name: Import project
        run: godot --headless --path . --editor --import

      - name: Run gameplay checks
        run: |
          mkdir -p artifacts
          timeout 300 godot --headless --path . --script res://tests/playthrough.gd -- --test
          timeout 60 godot --headless --path . --script res://tests/touch_controls.gd -- --test --touch

      - name: Export browser and desktop builds
        run: |
          set -euo pipefail
          mkdir -p build/{web,windows,linux,macos}
          touch build/.gdignore
          godot --headless --path . --export-release "Web" build/web/index.html
          godot --headless --path . --export-release "Windows Desktop" build/windows/SparkyDiscovery.exe
          godot --headless --path . --export-release "Linux" build/linux/SparkyDiscovery.x86_64
          godot --headless --path . --export-release "macOS" build/macos/SparkyDiscovery.zip
          test -s build/web/index.html
          test -s build/web/index.pck
          test -s build/web/index.wasm
          test -s build/windows/SparkyDiscovery.exe
          test -s build/linux/SparkyDiscovery.x86_64
          test -s build/macos/SparkyDiscovery.zip

      # Keep a downloadable build even when itch.io has not been configured yet.
      - uses: actions/upload-artifact@v7
        with:
          name: sparky-${{ github.sha }}
          path: build/
          if-no-files-found: error
          retention-days: 7

      - name: Check itch.io configuration
        env:
          ITCH_PROJECT: ${{ vars.ITCH_PROJECT }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          if [[ ! "$ITCH_PROJECT" =~ ^[a-z0-9_-]+/[a-z0-9_-]+$ ]]; then
            echo "::error::Set the ITCH_PROJECT repository variable to your itch.io username/game-slug."
            exit 1
          fi
          if [[ -z "$BUTLER_API_KEY" ]]; then
            echo "::error::Add your itch.io API key as the BUTLER_API_KEY repository secret."
            exit 1
          fi

      - name: Install itch.io Butler
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/butler"
          curl --fail --location --retry 3 https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default -o "$RUNNER_TEMP/butler.zip"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler"
          chmod +x "$RUNNER_TEMP/butler/butler"
          echo "$RUNNER_TEMP/butler" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/butler/butler" version

      - name: Publish all builds
        env:
          ITCH_PROJECT: ${{ vars.ITCH_PROJECT }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          version="${GITHUB_RUN_NUMBER}-${GITHUB_SHA:0:8}"
          butler push build/web "$ITCH_PROJECT:html5" --userversion "$version"
          butler push build/windows "$ITCH_PROJECT:windows" --userversion "$version"
          butler push build/linux "$ITCH_PROJECT:linux" --userversion "$version"
          butler push build/macos/SparkyDiscovery.zip "$ITCH_PROJECT:macos" --userversion "$version"
